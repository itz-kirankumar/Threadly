services:
  laya:
    build:
      context: ./infra/laya
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:${LAYA_PORT:-8000}:8000"
    environment:
      LAYA_HOST: 0.0.0.0
      LAYA_PORT: 8000
      LAYA_API_KEY_FILE: /run/secrets/laya_api_key
      LAYA_DEVICE: ${LAYA_DEVICE:-cpu}
      LAYA_PRELOAD: "1"
      LAYA_MODELS: english,multilingual
      LAYA_DEFAULT_MODEL: english
      LAYA_MAX_LOADED: "2"
      LAYA_THREADS: ${LAYA_THREADS:-4}
      OMP_NUM_THREADS: ${LAYA_THREADS:-4}
      HF_HOME: /home/laya/.cache/huggingface
    volumes:
      - laya-model-cache:/home/laya/.cache/huggingface
    secrets:
      - laya_api_key
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15m

secrets:
  laya_api_key:
    file: ./infra/laya/secrets/api-key

volumes:
  laya-model-cache:
